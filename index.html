<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz 2 — Professor Moreira</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#eaf6ff;color:#10243e;font-family:Arial,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:14px 14px 94px}
.brand{background:#0b3b70;color:white;padding:14px;border-radius:18px;margin-bottom:12px;text-align:center}
.brand b{font-size:21px} .brand small{display:block;margin-top:4px}
.card{background:white;border-radius:20px;padding:18px;box-shadow:0 6px 22px #0002}
.meta{font-size:13px;font-weight:bold;color:#41627f;margin-bottom:10px} h2{font-size:23px;margin:4px 0 15px}
.qtext{font-size:19px;line-height:1.45;white-space:pre-wrap;margin-bottom:15px}
.alt{display:block;width:100%;text-align:left;border:2px solid #bdd7ea;background:#f8fcff;padding:13px;margin:9px 0;border-radius:14px;font-size:17px;line-height:1.3}
.alt.correct{background:#dff6e5;border-color:#219653} .alt.wrong{background:#ffe1e1;border-color:#d62828}
.alt:disabled{color:#10243e;opacity:1} .feedback{margin-top:15px;padding:14px;border-radius:14px;font-weight:bold}
.ok{background:#dff6e5;color:#166534} .no{background:#ffe1e1;color:#9b1c1c}
.explain{font-size:17px;line-height:1.55;white-space:pre-wrap} .answer{font-size:22px;font-weight:bold;color:#166534;margin-bottom:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0b2545;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:9px}
.nav button{border:0;border-radius:12px;padding:11px 15px;font-weight:bold;font-size:16px} .count{color:white;align-self:center;min-width:74px;text-align:center}
.hide{display:none} .tip{margin-top:12px;color:#526b82;font-size:14px}
</style></head><body>
<div class="app"><div class="brand"><b>Curso de Contabilidade Professor Moreira</b><small>Quiz 2 • 10 questões • Padrão Mobile</small></div><div id="root"></div></div>
<div class="nav"><button onclick="prev()">← Voltar</button><span class="count" id="count"></span><button onclick="next()">Avançar →</button><button onclick="restart()">↻</button></div>
<script>
const Q=[{"n": 11, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "Em 2024, uma empresa de varejo estimava inadimplência de 2% sobre o saldo de Clientes. Em 2025, buscando aumentar as vendas, a empresa reduziu as suas exigências para concessão de crédito aos clientes. Assim, uma análise criteriosa indicava que a inadimplência seria muito próxima de 5% nesse ano. No entanto, uma vez que os administradores da empresa são avaliados de acordo com o resultado operacional, eles escolheram continuar utilizando a estimativa anterior, de 2%. Ao avaliar se a informação contábil pode ser considerada representação fidedigna, é correto concluir que", "alts": {"A": "pode ser, uma vez que é comparável.", "B": "pode ser, uma vez que é tempestiva.", "C": "não pode ser, uma vez que não é neutra.", "D": "não pode ser, uma vez que não é verificável."}, "g": "C", "exp": "A administração manteve 2% apesar de evidência de inadimplência próxima de 5% para preservar o resultado pelo qual é avaliada. Isso introduz viés e compromete a neutralidade, componente da representação fidedigna. Comparabilidade ou tempestividade não corrigem esse viés; o problema narrado não é falta de verificabilidade."}, {"n": 12, "banca": "FGV - Ana (TJ SC)/TJ SC/Contábil-Econômico/2026", "q": "Uma entidade vende matéria-prima a terceiros. Em 01/03/2026, um cliente mostrou interesse em realizar uma grande encomenda com pagamento previsto para 120 dias. Em 31/03/2026, as demonstrações contábeis do cliente foram publicadas. Após analisar o Balanço Patrimonial, a entidade decidiu não aceitar a encomenda. Com base no Pronunciamento Técnico CPC 00 (R2) – Estrutura Conceitual para Relatório Financeiro, a informação recebida", "alts": {"A": "é relevante, uma vez que teve valor confirmatório da situação.", "B": "é relevante, uma vez que fez diferença na decisão tomada pela entidade.", "C": "não é relevante, uma vez que não teve valor preditivo.", "D": "não é relevante, uma vez que a entidade não terá um relacionamento com o cliente.", "E": "não é relevante, uma vez que a entidade poderia ter conhecimento sobre a situação a partir de outras fontes."}, "g": "B", "exp": "Informação é relevante quando é capaz de fazer diferença em uma decisão. O balanço publicado levou a entidade a rejeitar a encomenda, logo a informação efetivamente influenciou a decisão. Não é necessário que haja relacionamento posterior nem que a informação seja exclusiva daquela fonte."}, {"n": 13, "banca": "FGV - Cont (NAV Brasil)/NAV Brasil/2026", "q": "A Cia X tem como único fornecedor a Cia Y. A Cia X e a Cia Y elaboram as suas demonstrações contábeis com base na premissa de continuidade operacional. De acordo com a NBC TG Estrutura Conceitual - Estrutura Conceitual para Relatório Financeiro, com base na continuidade operacional, é possível presumir que as entidades não têm a intenção e nem a necessidade de", "alts": {"A": "entrar em liquidação.", "B": "buscar novos parceiros.", "C": "aumentar os seus preços.", "D": "otimizar o número de filiais.", "E": "modificar as suas políticas contábeis."}, "g": "A", "exp": "Na continuidade operacional presume-se que a entidade continuará em operação no futuro previsível, sem intenção nem necessidade de entrar em liquidação ou deixar de negociar. Buscar parceiros, alterar preços, otimizar filiais ou modificar políticas não define a premissa."}, {"n": 14, "banca": "FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026", "q": "Em 01/01/2025, uma sociedade empresária investiu R$90.000 em uma aplicação financeira de longo prazo. Os juros são reconhecidos mensalmente e adicionados ao principal, para resgate no final do período da aplicação. Ao analisar as movimentações nas demonstrações contábeis, o perito contábil constatou que, mensalmente, em 2025, houve", "alts": {"A": "reconhecimento de receita financeira e aumento no ativo circulante.", "B": "reconhecimento de receita financeira e aumento no ativo realizável a longo prazo.", "C": "reconhecimento de receita financeira e aumento em investimentos.", "D": "reconhecimento de receita operacional e aumento no ativo realizável a longo prazo.", "E": "reconhecimento de receita operacional e aumento em investimentos."}, "g": "B", "exp": "A aplicação é de longo prazo. Os juros mensais aumentam o valor do direito classificado no realizável a longo prazo e são reconhecidos como receita financeira. Não se trata de receita operacional nem da conta 'Investimentos' no sentido apresentado pelas alternativas."}, {"n": 15, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "Em dezembro de 2025, uma empresa de perícia contábil prestou serviços a terceiros, tendo recebido, à vista, R$200.000. Em relação à equação fundamental do patrimônio, houve variação nos seguintes grupos", "alts": {"A": "ativo, apenas.", "B": "patrimônio líquido, apenas.", "C": "ativo e passivo.", "D": "ativo e patrimônio líquido.e)  passivo e patrimônio líquido."}, "g": "D", "exp": "Serviço prestado e recebido à vista: entra caixa, aumentando o ativo, e reconhece-se receita, que aumenta o resultado e, consequentemente, o patrimônio líquido. Não surge passivo pela operação descrita."}, {"n": 16, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "Em 01/01/2025, uma sociedade empresária pagou, antecipadamente, o seguro de dois anos de seus veículos. O valor pago foi de R$36.000 e o seguro é apropriado mensalmente de modo linear. No momento do pagamento, o Balanço Patrimonial da sociedade empresária variou do seguinte modo:", "alts": {"A": "o ativo circulante e o patrimônio líquido diminuíram em R$36.000.", "B": "o passivo circulante aumentou e o patrimônio líquido diminuiu em R$18.000.", "C": "o ativo circulante diminuiu e o realizável a longo prazo aumentou em R$18.000.", "D": "o ativo realizável a longo prazo e o passivo circulante aumentaram em R$36.000.", "E": "o ativo circulante diminuiu e o realizável a longo prazo aumentou em R$36.000."}, "g": "C", "exp": "O seguro cobre 24 meses. No pagamento, 12 meses correspondem ao curto prazo (R$18.000) e 12 meses ao longo prazo (R$18.000). O caixa cai R$36.000; simultaneamente surgem direitos de seguro a apropriar, com R$18.000 no circulante e R$18.000 no realizável a longo prazo. Assim, comparando grupos, o AC diminui R$18.000 e o RLP aumenta R$18.000."}, {"n": 17, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Em janeiro de 2026, uma entidade reconheceu contabilmente um débito de R$ 30.000, decorrente de uma compra efetuada de terceiros, na conta de estoques. De acordo com o método das partidas dobradas, o lançamento pode ter como contrapartida um(a)", "alts": {"A": "aumento no resultado.", "B": "aumento em conta do ativo.", "C": "aumento em conta do passivo.", "D": "diminuição em conta do passivo.", "E": "diminuição em conta do patrimônio líquido."}, "g": "C", "exp": "Débito em Estoques aumenta um ativo. Em uma compra de terceiros a prazo, a contrapartida típica é crédito em Fornecedores, aumentando o passivo. As demais alternativas não representam a contrapartida coerente com a compra descrita."}, {"n": 18, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "A empresa “A” realizou a venda de 350.000 quadros de madeira (30x40 cm), totalizando R$ 250.000,00 em mercadorias vendidas. Sabe-se que o controle das mercadorias foi imediatamente transferido aos clientes. O recebimento foi distribuído da seguinte forma: 50% em Caixa, 25% em Banco, e 25% a prazo, com vencimento em 30 dias. Com base nesses dados, assinale a opção correta quanto à contabilização dessas operações.", "alts": {"A": "Débito: Caixa R$ 125.000,00 Débito: Banco Conta Movimento R$ 62.500,00 Débito: Duplicatas a Receber R$ 62.500,00 Crédito: Receita de Vendas R$ 250.000,00", "B": "Débito: Caixa R$ 125.000,00 Débito: Duplicatas a Receber R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00", "C": "Débito: Caixa R$ 250.000,00 Crédito: Receita de Vendas R$ 250.000,00", "D": "Débito: Caixa R$ 125.000,00 Débito: Banco R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00"}, "g": "A", "exp": "Venda total de R$250.000: 50% em Caixa = R$125.000; 25% em Banco = R$62.500; 25% a prazo = R$62.500. Debitam-se esses ativos e credita-se Receita de Vendas em R$250.000. Só a alternativa A distribui corretamente os três recebimentos."}, {"n": 19, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "Ao preparar o encerramento do exercício, o setor de Contabilidade da companhia “B” S.A. listou as seguintes contas e seus respectivos saldos: 1. Adiantamento a fornecedor: R$ 12.000,00; 2. Adiantamento de clientes: R$ 8.000,00; 3. Encargos financeiros a transcorrer (sobre empréstimos bancários obtidos): R$ 3.500,00; 4. Ações de emissão própria em tesouraria: R$ 5.000,00; 5. Juros sobre o capital próprio a pagar: R$ 4.500,00; 6. Perdas estimadas com créditos de liquidação duvidosa: R$ 2.000,00. Assinale a opção que indica o somatório correto, em valores absolutos, das contas de natureza devedora.", "alts": {"A": "R$ 20.500,00.", "B": "R$ 15.500,00.", "C": "R$ 12.000,00.", "D": "R$ 20.000,00."}, "g": "A", "exp": "Contas de natureza devedora consideradas no gabarito: Adiantamento a fornecedor R$12.000; Encargos financeiros a transcorrer R$3.500; Ações em tesouraria R$5.000. Soma absoluta = R$20.500. Adiantamento de clientes e JCP a pagar têm natureza credora; perdas estimadas com créditos são conta redutora do ativo, de natureza credora."}, {"n": 20, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Uma entidade presta serviços a terceiros. Em janeiro de 2026, a entidade reconheceu receita de R$ 400.000. O valor deverá ser recebido em março. A entidade estima inadimplência de 5%. O fato trouxe o seguinte aumento nos elementos patrimoniais da entidade", "alts": {"A": "R$ 380.000 no ativo e no patrimônio líquido.", "B": "R$ 380.000 no passivo e no patrimônio líquido.", "C": "R$ 400.000 no ativo e no patrimônio líquido.", "D": "R$ 400.000 no passivo e no patrimônio líquido.", "E": "R$ 400.000 no ativo, R$ 20.000 no passivo e R$ 380.000 no patrimônio líquido."}, "g": "A", "exp": "A receita a prazo gera direito de R$400.000, mas a perda estimada de 5% é R$20.000. Efeito líquido no ativo = R$380.000; o efeito líquido no resultado e no PL também é R$380.000. A perda estimada não é apresentada como passivo."}]; let qi=0, side=0, answered=false, selected=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const x=Q[qi], root=document.getElementById('root'); document.getElementById('count').textContent=(qi+1)+' / 10';
 if(side===0){
  let a=Object.entries(x.alts).map(([k,v])=>`<button class="alt ${answered?(k===x.g?'correct':(k===selected&&k!==x.g?'wrong':'')):''}" ${answered?'disabled':''} onclick="choose('${k}')"><b>${k})</b> ${esc(v)}</button>`).join('');
  root.innerHTML=`<div class="card"><div class="meta">${esc(x.banca)} • Questão original nº ${x.n}</div><h2>QUESTÃO</h2><div class="qtext">${esc(x.q)}</div>${a}${answered?`<div class="feedback ${selected===x.g?'ok':'no'}">${selected===x.g?'✓ Resposta correta!':'✗ Resposta incorreta. Gabarito: '+x.g}<br>Avance para ver a explicação completa.</div>`:''}<div class="tip">Responda antes de avançar. A próxima tela traz a resolução comentada.</div></div>`;
 } else {
  let wrong=Object.entries(x.alts).filter(([k])=>k!==x.g).map(([k,v])=>`<p><b>${k}) ERRADA:</b> ${esc(v)}</p>`).join('');
  root.innerHTML=`<div class="card"><div class="meta">${esc(x.banca)} • Questão original nº ${x.n}</div><h2>RESOLUÇÃO COMENTADA</h2><div class="answer">✓ Gabarito: ${x.g}) ${esc(x.alts[x.g])}</div><div class="explain"><b>Explicação:</b><br>${esc(x.exp)}<hr><b>Por que as demais estão erradas?</b>${wrong}</div></div>`;
 }
 window.scrollTo(0,0);
}
function choose(k){if(answered)return; selected=k; answered=true; render()}
function next(){if(side===0){side=1}else if(qi<Q.length-1){qi++;side=0;answered=false;selected=null} render()}
function prev(){if(side===1){side=0}else if(qi>0){qi--;side=1;answered=true;selected=Q[qi].g} render()}
function restart(){qi=0;side=0;answered=false;selected=null;render()}
render();
</script></body></html>
